<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf3ee" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" type="image/svg+xml" href="/life-clock/favicon.svg" />
    <link rel="manifest" href="/life-clock/manifest.webmanifest" />

    <!-- Google Fonts: 数字に Mochiy Pop One(丸ゴ・タップしたくなる柔らかさ)、見出しに Zen Maru Gothic、本文に M PLUS Rounded -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;600;700&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />

    <title>命の時計 — あの子の生後をぱっと見る</title>
    <meta name="description" content="あの子の生後(月齢/週齢/累計日/誕生日カウントダウン/干支)を 1 画面で同時表示し、タップでコピーできる書類記入特化アプリ。子・孫・甥姪・友達の子・ペットまで対応。" />

    <!-- iOS PWA: ホーム画面追加で全画面起動 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="命の時計" />
    <link rel="apple-touch-icon" href="/life-clock/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="命の時計 — あの子の生後をぱっと見る" />
    <meta property="og:description" content="月齢・週齢・累計日・干支を 1 画面で同時表示。タップ 1 つでコピーできる、書類記入のおとも。" />
    <meta property="og:image" content="/life-clock/og.svg" />
    <meta property="og:site_name" content="命の時計" />
    <meta property="og:locale" content="ja_JP" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="命の時計 — あの子の生後をぱっと見る" />
    <meta name="twitter:description" content="月齢・週齢・累計日・干支を 1 画面で同時表示。タップ 1 つでコピー。" />
    <meta name="twitter:image" content="/life-clock/og.svg" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast" hidden>コピーしました</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
