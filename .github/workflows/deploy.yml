name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時並行 deploy を抑止(古い run はキャンセル)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # コミット前 3 点セット(typecheck / test / build)を CI でも強制
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # enablement: true で Pages 未有効でも workflow 側から自動有効化
      # (Source = GitHub Actions に設定)。"Get Pages site failed" 対策。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
