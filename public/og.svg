<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9f5"/>
      <stop offset="100%" stop-color="#fde5dc"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5a397"/>
      <stop offset="100%" stop-color="#ec8478"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ec8478"/>
      <stop offset="100%" stop-color="#c45f4e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="-0.08" r="0.45">
      <stop offset="0%" stop-color="rgba(236,132,120,0.20)"/>
      <stop offset="100%" stop-color="rgba(236,132,120,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 時計+ハート アイコン(左) -->
  <g transform="translate(180, 195)">
    <circle cx="115" cy="115" r="100" fill="#ffffff" stroke="rgba(150,100,90,0.10)" stroke-width="1"/>
    <circle cx="115" cy="115" r="100" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"/>
    <g fill="#ec8478" opacity="0.65">
      <circle cx="115" cy="36" r="6"/>
      <circle cx="115" cy="194" r="6"/>
      <circle cx="36" cy="115" r="6"/>
      <circle cx="194" cy="115" r="6"/>
    </g>
    <path d="M115 152
             C 107 147, 80 130, 80 109
             C 80 96, 89 87, 99 87
             C 106 87, 111 91, 115 96
             C 119 91, 124 87, 131 87
             C 141 87, 150 96, 150 109
             C 150 130, 123 147, 115 152 Z"
          fill="url(#heart)"/>
  </g>

  <!-- テキスト(右) -->
  <g transform="translate(490, 0)">
    <text x="0" y="180" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans',system-ui,sans-serif" font-size="22" font-weight="500" fill="#8a7870" letter-spacing="6">L I F E   C L O C K</text>
    <text x="0" y="290" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans',system-ui,sans-serif" font-size="100" font-weight="600" fill="#1a1410">命の時計</text>
    <text x="0" y="370" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans',system-ui,sans-serif" font-size="32" fill="#8a7870">あの子の生後を、ぱっと見る。</text>

    <g transform="translate(0, 430)">
      <rect x="0" y="0" width="240" height="60" rx="30" fill="#fde5dc"/>
      <text x="120" y="40" text-anchor="middle" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans',system-ui,sans-serif" font-size="22" font-weight="600" fill="#c45f4e">タップでコピー</text>
    </g>
    <g transform="translate(260, 430)">
      <rect x="0" y="0" width="220" height="60" rx="30" fill="#fde5dc"/>
      <text x="110" y="40" text-anchor="middle" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans',system-ui,sans-serif" font-size="22" font-weight="600" fill="#c45f4e">和暦・干支も</text>
    </g>
  </g>
</svg>
