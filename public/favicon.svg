<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- maskable safe zone は中心 80% (102.4,102.4 〜 153.6,153.6) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9f5"/>
      <stop offset="100%" stop-color="#fde5dc"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5a397"/>
      <stop offset="100%" stop-color="#ec8478"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ec8478"/>
      <stop offset="100%" stop-color="#c45f4e"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- 時計の輪郭 -->
  <circle cx="128" cy="128" r="76" fill="#ffffff" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"/>
  <!-- 12/3/6/9 時の小ドット -->
  <g fill="#ec8478" opacity="0.65">
    <circle cx="128" cy="68" r="4.5"/>
    <circle cx="128" cy="188" r="4.5"/>
    <circle cx="68" cy="128" r="4.5"/>
    <circle cx="188" cy="128" r="4.5"/>
  </g>
  <!-- 中央のハート(時計の中心装飾) -->
  <path d="M128 156
           C 122 152, 102 138, 102 122
           C 102 113, 109 106, 117 106
           C 122 106, 126 109, 128 113
           C 130 109, 134 106, 139 106
           C 147 106, 154 113, 154 122
           C 154 138, 134 152, 128 156 Z"
        fill="url(#heart)"/>
</svg>
